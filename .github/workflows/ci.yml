name: forensic-pipeline

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify evidence hashes
        run: sha256sum -c evidence/HASHES.sha256

      - name: Regression tests (findings must be reproducible)
        run: python -m unittest discover -s tests -v

      - name: Re-run extractor
        run: python tools/ulog_forensic_extractor.py evidence/ulog/12127aab-02aa-4e98-890a-f17523ebba0c.ulg -o /tmp/out

      - name: Render flight profile
        run: |
          pip install matplotlib
          python tools/plot_flight_profile.py evidence/ulog/12127aab-02aa-4e98-890a-f17523ebba0c.ulg -o /tmp/flight_profile.png
